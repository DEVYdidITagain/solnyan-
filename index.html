<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$SOLNYAN - Solana Nyan</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      color: white;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .logo {
      font-family: 'Press Start 2P', cursive;
      font-size: 2.2rem;
      background: linear-gradient(90deg, #22d3ee, #a855f7, #ec4899, #22d3ee);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 4s ease infinite;
      margin-bottom: 10px;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ticker {
      font-size: 1.1rem;
      color: #a5b4fc;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 40px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
    }

    .btn-telegram {
      background: #0088cc;
      color: white;
    }

    .btn-telegram:hover {
      background: #0077b5;
      transform: translateY(-2px);
    }

    .btn-x {
      background: #000;
      color: white;
      border: 1px solid #333;
    }

    .btn-x:hover {
      background: #111;
      transform: translateY(-2px);
    }

    .btn-pump {
      background: linear-gradient(90deg, #14f195, #9945ff);
      color: #0a0a0f;
    }

    .btn-pump:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 50px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .rainbow-line {
      height: 3px;
      width: 120px;
      background: linear-gradient(90deg, #22d3ee, #a855f7, #ec4899);
      margin: 20px auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">$SOLNYAN</div>
    <div class="ticker">SOLANA NYAN</div>

    <div class="rainbow-line"></div>

    <p class="description">
      Nyan Cat never left.<br>
      Still flying on SOL.<br>
      Cats are meta.<br>
      Robinhood can keep the stocks — we kept the rainbow.
    </p>

    <div class="buttons">
      <!-- Telegram -->
      <a href="https://t.me/SolanaNYAN" target="_blank" class="btn btn-telegram">
        Join Telegram
      </a>

      <!-- X (Twitter) - REPLACE THIS LINK -->
      <a href="https://x.com/SolNyanCA" target="_blank" class="btn btn-x">
        Follow on X
      </a>

      <!-- Pump.fun - REPLACE THIS LINK once you launch -->
      <a href="https://pump.fun/coin/2hkm3ngu1Nd5rZqV4GMkjDVrquZecPSsZdh2HjQJpump" class="btn btn-pump">
        Buy on Pump.fun
      </a>
    </div>

    <div class="footer">
      Nyan never left Solana 🌈
    </div>
  </div>
</body>
</html>
